name: Build CV
# build commands are run twice in order to resolve cross-references

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: false
          load: true
          tags: cv-builder:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build German CV
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            cv-builder:latest \
            bazel run //:cv_de

      - name: Build English CV
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            cv-builder:latest \
            bazel run //:cv_en

      - name: Create release package
        run: |
          cd release
          zip -r ../cv-pdfs.zip .

      - name: Publish GitHub release package
        uses: softprops/action-gh-release@v2
        with:
          files: cv-pdfs.zip
          tag_name: cv-latest
          name: CV PDFs
          body: Automated build of the German and English CV PDFs using Docker.
