name: Build CV
# build commands are run twice in order to resolve cross-references

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-fonts-recommended texlive-latex-extra texlive-lang-german

      - name: Install Bazelisk
        uses: bazelbuild/setup-bazelisk@v3

      - name: Build German CV
        run: bazel run //:cv_de

      - name: Build English CV
        run: bazel run //:cv_de

      - name: Create release package
        run: |
          cd release
          zip -r ../cv-pdfs.zip .

      - name: Publish GitHub release package
        uses: softprops/action-gh-release@v2
        with:
          files: cv-pdfs.zip
          tag_name: cv-latest
          name: CV PDFs
          body: Automated build of the German and English CV PDFs.
