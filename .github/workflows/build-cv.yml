name: Build CV

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-fonts-recommended texlive-latex-extra

      - name: Build German CV
        run: |
          mkdir -p build
          cd src
          xelatex -interaction=nonstopmode -halt-on-error -output-directory=../build cv_simon_werner.tex

      - name: Build English CV
        run: |
          cd src
          xelatex -interaction=nonstopmode -halt-on-error -output-directory=../build -jobname=cv_simon_werner_en "\def\cvvariant{english}\input{cv_simon_werner.tex}"

      - name: Create release package
        run: |
          mkdir -p release
          cp build/cv_simon_werner.pdf release/cv_simon_werner.pdf
          cp build/cv_simon_werner_en.pdf release/cv_simon_werner_en.pdf
          cd release
          zip -r ../cv-pdfs.zip .

      - name: Publish GitHub release package
        uses: softprops/action-gh-release@v2
        with:
          files: cv-pdfs.zip
          tag_name: cv-latest
          name: CV PDFs
          body: Automated build of the German and English CV PDFs.
